<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="{{ page.description | default: 'LLM Knowledge Base — free models, pricing, benchmarks, EOL dates.' }}">
  <title>{{ page.title | default: 'LLM Knowledge Base' }} | neohiro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  <link rel="stylesheet" href="{{ 'assets/llm-kb.css' | relative_url }}">
  <link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}">
  {% seo %}
  {% feed_meta %}
</head>
<body>
  <!-- Matrix rain -->
  <canvas id="matrix-canvas" aria-hidden="true"></canvas>
  <div id="glitch-overlay" class="glitch-overlay" aria-hidden="true">
    <div class="glitch-text" data-text="LLM"></div>
  </div>

  <div class="page-wrapper">
    <header class="site-header" role="banner">
      <div class="container">
        <a class="site-brand" href="{{ '/' | relative_url }}" aria-label="neohiro - Home">
          <span class="logo-mark" aria-hidden="true">👽</span>
          <span class="logo-text">neohiro</span>
        </a>
        <nav class="site-nav" aria-label="Main navigation">
          <a href="{{ '/llm/' | relative_url }}" class="nav-link nav-active">LLM KB</a>
          <a href="{{ '/worldmap/' | relative_url }}" class="nav-link">World Map</a>
          <a href="#providers" class="nav-link">Providers</a>
          <a href="#pricing" class="nav-link">Pricing</a>
          <a href="https://github.com/sponsors/neohiro" class="nav-link nav-sponsor" target="_blank">Sponsor</a>
        </nav>
      </div>
    </header>

    <main class="site-main" role="main">
      {{ content }}
    </main>

    <footer class="site-footer" role="contentinfo">
      <div class="container">
        <p class="footer-tagline">Made with ♥ by neohiro</p>
        <p class="footer-links">
          <a href="https://github.com/neohiro" target="_blank">GitHub</a>
          <span>·</span>
          <a href="https://github.com/sponsors/neohiro" target="_blank">Sponsor</a>
          <span>·</span>
          <a href="https://linktr.ee/frenzypenguin.media" target="_blank">Links</a>
        </p>
        <div class="sponsor-links">
          <a href="https://neohiro.github.io/frenzypenguin-media/" target="_blank">🎬 FrenzyPenguin Media</a>
          <a href="https://transhumanists.github.io/" target="_blank">🧬 transhumanists</a>
          <a href="https://github.com/sponsors/neohiro" class="sponsor-red" target="_blank">♥ Sponsor neohiro</a>
        </div>
        <p class="footer-copyright">Source: <a href="https://github.com/neohiro/LLM">neohiro/LLM</a> (private) · Public mirror updated daily</p>
      </div>
    </footer>
  </div>

  <script src="{{ '/assets/js/main.js' | relative_url }}"></script>
</body>
</html>
