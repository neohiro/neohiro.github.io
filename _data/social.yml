# social.yml — "find us on" data for _includes/social-links.html.
#
# This file is the reason every social link on this site was silently absent:
# social-links.html reads site.data.social.<key>, and no social.yml existed in
# any of the four sites. With it present the existing include renders the links
# with no template change at all.
#
# Keys consumed by the include: github, sponsors, youtube, mastodon, bluesky,
# twitter, discord, website. Any key left out is simply not rendered.
#
# NOTE: something in this repo's tooling prunes or resets files under _data/ on
# the sites that site_forge.py syncs - this file disappeared once already and had
# to be recreated. verify_social_links.py fails if it goes missing again, so it
# cannot fail silently a third time.
github: neohiro
sponsors: neohiro
bluesky: neohiro.bsky.social
youtube: FrenzyPenguinMedia
website: https://neohiro.github.io