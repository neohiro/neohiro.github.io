title: neohiro
description: "Security hardening & privacy tools for Windows and Linux."
url: "https://neohiro.github.io"
baseurl: ""
github_username: neohiro
github_repo: neohiro.github.io
sponsor_username: neohiro
dashboard_url: "https://github.com/neohiro/dashboard"

# Top-bar contract. Rendered by _includes/nav.html — ONE template serves every
# site in the network; only these lists differ. Format is "Label|url" with an
# optional trailing drop-priority (2|3|4). Labels MUST stay one word: the bar is
# not sticky, so a long label is the only thing that can force a wrap on a phone.
# Everything dropped at narrow widths stays reachable via the footer and the
# Community menu.
nav_links:
  - "Tools|/#featured-tools"
  - "Guides|/#hardening-guides"
  - "Repos|/repositories/"
  - "Live|/live.html|3"
  - "Beats|/heartbeats/|4"
  - "Keys|/meshcore-vanity-key/|2"
  - "Media|/media/|3"
  - "Setup|/onboard/|4"

community_links:
  - "Org Overview|https://github.com/neohiro"
  - "Bug Reports|https://github.com/neohiro/windows/issues"
  - "Security|https://github.com/neohiro/windows/security"
  - "Discussions|https://github.com/neohiro/windows/discussions"
  - "Heartbeats|/heartbeats/"
  - "Access|/request-access/"
  - "Sponsor|https://github.com/sponsors/neohiro"

# Visitor counter (SSOT: links-secret/counter-surfaces.spec.yaml)
# Rendered via _includes/counter-widget.html in _layouts/default.html.
counter_id: "1631173"

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

collections:
  tools:
    output: true
    permalink: /tools/:name/

defaults:
  - scope:
      path: ""
      type: "tools"
    values:
      layout: "tool"

exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - .github
  - README.md
  - LICENSE
  - scripts
  - "*.ps1"
  - "*.sh"