title: neohiro
description: "Security hardening & privacy tools for Windows and Linux."
url: "https://neohiro.github.io"
baseurl: ""
github_username: neohiro
github_repo: neohiro.github.io

# >>> top-bar contract (managed by template-shared/site_forge.py)
# Top-bar contract. Rendered by _includes/nav.html — ONE template serves
# every site in the network; only these lists differ. Format is
# "Label|url" with an optional trailing drop-priority (2|3|4). Labels MUST
# stay one word: the bar is not sticky, so a long label is the only thing
# that can force a wrap on a phone. Only link pages that actually exist.
github_username: "neohiro"
sponsor_username: "neohiro"
dashboard_url: "https://github.com/neohiro/dashboard"

nav_links:
  - "Tools|/#featured-tools"
  - "Guides|/#hardening-guides"
  - "Repos|/repositories/"
  - "Live|/live.html|3"
  - "Beats|/heartbeats/|4"
  - "Keys|/meshcore-vanity-key/|2"
  - "Media|/media/|3"
  - "Setup|/onboard/|4"

community_links:
  - "Org Overview|https://github.com/neohiro"
  - "Bluesky|https://bsky.app/profile/neohiro.bsky.social"
  - "Bug Reports|https://github.com/neohiro/windows/issues"
  - "Security|https://github.com/neohiro/windows/security"
  - "Discussions|https://github.com/neohiro/windows/discussions"
  - "Heartbeats|/heartbeats/"
  - "Access|/request-access/"
  - "Sponsor|https://github.com/sponsors/neohiro"

main_sections:
  - "Home|#home"
  - "Signal|#quotes"
  - "Tools|#featured-tools"
  - "Guides|#hardening-guides"
  - "Community|#community"

# Bottom-bar and assistant contract. request_access is the public gate for
# the private assistant; an empty string means the site has no access page
# yet and the dock must not link one.
assistant:
  request_access: "/request-access/"
  dashboard_url: "https://github.com/neohiro/dashboard"

palette: "purple-matrix"
fonts: "matrix"
decor: "matrix"
decor_class: "decor-matrix decor-scanlines decor-grain"
font_google: "JetBrains+Mono:wght@400;500;700|Space+Grotesk:wght@400;500;600;700"
# <<< top-bar contract

# Jekyll plugins. Restored in bfc7cae's wake - see the commit message there for
# why these went missing, but the short version is that the site-tokens /
# site-forge sync rewrote this file and dropped everything below the
# top-bar contract markers, including this block.
#
# `plugins:` is what registers the `{% seo %}`, `{% feed_meta %}` and
# `{% sitemap %}` tags. Without it the gems are in the Gemfile but never
# loaded, and Jekyll fails the whole build on the first one it meets:
#
#   Liquid Exception: Liquid syntax error (line 20): Unknown tag 'seo'
#   in _layouts/default.html
#
# `collections` and `defaults` went the same way, and those matter too: the 17
# files in `_tools/` are only published because of the `tools` collection and
# the `layout: "tool"` default that points them at _layouts/tool.html. Without
# them Jekyll silently stops publishing that directory rather than failing -
# which is worse, because the build goes green and the tool pages vanish.
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

collections:
  tools:
    output: true
    permalink: /tools/:name/

defaults:
  - scope:
      path: ""
      type: "tools"
    values:
      layout: "tool"

exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - .github
  - README.md
  - LICENSE
  - scripts
  - "*.ps1"
  - "*.sh"
