name: Build & Deploy (Jekyll)

on:
  push:
    branches:
      main
  pull_request:
    branches:
      main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Branch protection on main requires a status check named `verify`, and until
  # this job existed no workflow in the repository produced one. The requirement
  # could therefore never be satisfied, so every pull request sat at BLOCKED
  # regardless of its own state. The job name is load-bearing: renaming it
  # re-freezes the repository.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Offline, stdlib only. Catches a layout or stylesheet link naming a file
      # that is not in the repository -- which is what happened to the
      # Ecosystem Network frame on all four sites: present in a working tree,
      # absent from the repo, so CI either aborted on a missing include or
      # rendered the footer unstyled with a green build.
      - name: Verify every include and asset reference resolves
        run: python scripts/verify_references.py
      # Complement, not duplicate: verify_references.py resolves includes,
      # assets and page routes. This checks the data layer -- repos.yml vs
      # _tools front-matter drift, unknown fields, UTF-8 BOMs and mojibake.
      # This repo has shipped BOM and mojibake defects more than once
      # (assets/css/main.css, assets/js/network-ux.js), and this script was
      # unwired after 61050fe, so those checks only ran if invoked by hand.
      - name: Verify _tools <-> _data/repos.yml consistency
        run: python scripts/verify_data.py

  build:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          cache-version: v2

      - name: Build Jekyll Site
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./_site

  deploy:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5