name: Build & Deploy

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          cache-version: v2

      - name: Debug file
        if: always()
        run: |
          bundle exec ruby -e "
            path = '_data/repos.json'
            data = File.binread(path)
            puts 'SIZE:' + data.bytesize.to_s
            puts 'FIRST15:' + data.bytes[0..14].inspect
            puts 'CONTROL:' + data.bytes.count{|b| b < 0x09 || (b >= 0x0B && b <= 0x0D && b != 0x0A && b != 0x09) || (b >= 0x1F && b != 0x7F) }.to_s
            puts 'ENCODING:' + data.encoding.to_s
            require 'json'
            j = JSON.parse(data)
            puts 'JSON_OK:' + j['repos'].length.to_s
            require 'safe_yaml'
            y = SafeYAML.load(data)
            puts 'SAFEYAML_OK:' + y.class.to_s
          "

      - name: Build Jekyll Site
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4